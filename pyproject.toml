[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism"
version = "0.1.0"
description = "PRISM — modality-portable hybrid linear-recurrent (SSD + Gated Delta) sequence backbone"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "torch>=2.5",  # torch.associative_scan (prototype HOP) used by the SSD scan
]

[project.optional-dependencies]
train = [
    "torchvision>=0.16",
    "tensorboard>=2.14",
    "PyYAML>=6",
    "wfdb>=4.1",
    "pandas>=2",
    "torchaudio>=2.1",
]
# Optional GPU kernels: production delta-rule / SSD backends. All are optional —
# the pure-PyTorch reference paths run without them (see modules/delta.py,
# modules/ssd.py). Pin FLA per its CI-tested Triton version (kernel-stability
# issues on some Triton releases, e.g. fla-org #734 on H100 w/ Triton 3.2–3.6).
gpu = [
    "flash-linear-attention>=0.3.2,<0.4",
    "mamba-ssm>=2.2",
    "causal-conv1d>=1.4",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "PyYAML>=6",
    "hypothesis>=6.100",
]
test = [
    "pytest>=7.4",
    "hypothesis>=6.100",
    "PyYAML>=6",
    "scikit-learn>=1.3",  # optional AUROC cross-check in tests
]
hf = [
    "transformers>=4.36",
    "accelerate>=0.25",
    "safetensors>=0.4",
]

[project.urls]
Homepage = "https://github.com/kaelvalen/prism"

[project.scripts]
prism-train = "prism.training.cli:main"
prism-infer-ecg = "scripts.infer_ecg:main"
prism-infer-image = "scripts.infer_image:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prism*", "mom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["prism", "tests", "scripts", "train.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",
    "W293",
    "E702",
    "F841",
    "W292",
]
