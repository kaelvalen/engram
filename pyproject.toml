[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism"
version = "0.1.0"
description = "Parallel Recurrent Integrated Signal Model — modality-agnostic sequence backbone"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
]

[project.optional-dependencies]
train = [
    "torchvision>=0.16",
    "tensorboard>=2.14",
    "PyYAML>=6",
    "wfdb>=4.1",
    "pandas>=2",
    "torchaudio>=2.1",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]
hf = [
    "transformers>=4.36",
    "accelerate>=0.25",
    "safetensors>=0.4",
]

[project.urls]
Homepage = "https://github.com/kaelvalen/prism"

[project.scripts]
prism-train = "prism.training.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prism*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["prism", "tests", "scripts", "train.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",
    "W293",
    "E702",
    "F841",
    "W292",
]
