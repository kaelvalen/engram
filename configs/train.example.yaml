# Optional defaults for `python train.py --config configs/train.example.yaml`
# CLI flags override these values.

train:
  epochs: 50
  batch_size: 64
  lr: 0.0003
  hidden_dim: 256
  num_layers: 12
  block_pattern: hybrid  # hybrid | s4 | delta
  amp: bf16              # off | bf16

model:
  num_heads: 8
  delta_every: 4
