# Stage-0 surprise probe (design §6.4, stage 0): fixed-scale, frozen per-expert
# surprise_weight sweep. Question: "is the learned surprise signal useful AT ALL?"
# Not architectural learning — an insurance probe before Stages 1/2.
#
# The per-cell surprise_weight is set by scripts/mom_surprise_probe.py's grid;
# this file pins the base (predictor on, pred-loss weighting, probe freeze).
# Same model/task/optim recipe as spike.yaml so Stage 0 is apples-to-apples with
# the existing negative baseline (mom 0.023 vs GDR-only 0.096 @64).
experiment: mom-surprise-probe
seeds: [0, 1, 2]

model:
  kind: mom
  hidden_dim: 256
  num_heads: 4
  num_layers: 4
  experts: [ssd, gdr]
  top_k: 1
  shared_expert: null
  decay_on_skip: true
  gdr_decay_on_skip: false
  lambda_bal: 1.0e-2
  lambda_z: 1.0e-3
  # Reference backends: the probe measures routing behavior, not kernel
  # throughput, and equivalence to the production kernels is already proven by
  # tests. Using reference scans/delta avoids any Triton/CUDA-kernel dependency
  # (e.g. the NixOS /sbin/ldconfig issue) so Stage 0 runs anywhere.
  scan_backend: reference
  delta_backend: reference
  use_surprise_predictor: true
  surprise_pred_loss_weight: 0.1
  router_surprise_scale: 1.0
  freeze_surprise_weight: true
  # router_surprise_weight: set per grid cell by mom_surprise_probe.py

task:
  name: mqar
  vocab_size: 512
  num_pairs: 8
  seq_len: 64

optim:
  steps: 8000
  batch_size: 16
  lr: 1.0e-3
  weight_decay: 0.1
  warmup_frac: 0.03
  grad_clip: 1.0
  bf16: true

eval_every: 500
eval_contexts: [64, 256, 1024, 4096]
log_dir: output/mom
