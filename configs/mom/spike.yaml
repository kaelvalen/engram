# mom-spike (spec §4): 4 layers, d_model 256, {SSD, GDR}, k=1.
# 2-week viability spike on MQAR. Spike gate (§6.4): ≥ B1 and ≥ max(B2, B3)
# recall, AND final min expert utilization ≥ 10% (no hard collapse).
#
# Recipe note (2026-07-17): on the 8 GB RTX 5060 the spec's full sweep
# (64 pairs @ vocab 8k) does not reach the MQAR "click" inside 2k steps —
# that is an optimization-budget property of the benchmark, not a model bug
# (all models overfit a fixed batch to 100% in <100 steps; fp64 suites pass).
# This config is the learnable endpoint of the sweep used for the gate
# comparison; the harder sweep cells stay for larger-budget runs.
experiment: mom-spike
seeds: [0, 1, 2]

model:
  kind: mom
  hidden_dim: 256
  num_heads: 4
  num_layers: 4
  experts: [ssd, gdr]
  top_k: 1
  shared_expert: null
  decay_on_skip: true        # D1 default
  gdr_decay_on_skip: false   # §3.4 exact pass-through on a miss
  lambda_bal: 1.0e-2
  lambda_z: 1.0e-3

task:
  name: mqar
  vocab_size: 512
  num_pairs: 8
  seq_len: 64

optim:
  steps: 8000
  batch_size: 16
  lr: 1.0e-3
  weight_decay: 0.1
  warmup_frac: 0.03
  grad_clip: 1.0
  bf16: true

eval_every: 500
eval_contexts: [64, 256, 1024, 4096]  # generalization curve; gate reads 4k
log_dir: output/mom
